name: Quality Gate

on:
  pull_request:
  push:
    branches: [dev, main, master]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout Deploy Tools
        uses: actions/checkout@v4
        with:
          repository: Ometra-Core/Deploy-Tools
          ref: v1.1.1
          token: ${{ secrets.OMETRA_TOOLKIT_TOKEN }}
          path: .ometra/deploy-tools

      - name: Setup PHP
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        if: ${{ hashFiles('requirements*.txt', 'setup/requirements*.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run repository Quality Gate
        run: bash .ometra/deploy-tools/bin/local-quality-gate
